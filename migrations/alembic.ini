# migrations/alembic.ini
# Alembic configuration for the AI Agent Execution Platform.
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts (relative to this file's location)
script_location = .

# Connection string — overridden at runtime by env/config
# In practice we call `alembic -x db_url=<url> upgrade head`
# or set ALEMBIC_DATABASE_URL in the environment.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/agent_platform

# Migrations directory
version_locations = %(here)s/versions

# File naming template
file_template = %%(rev)s_%%(slug)s

# Truncate long migration slugs at 40 chars
truncate_slug_length = 40

# Produce .pyc files alongside .py migration scripts
# (set to false for clean dirs)
prepend_sys_path = .
version_path_separator = os   # Use os.pathsep

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
